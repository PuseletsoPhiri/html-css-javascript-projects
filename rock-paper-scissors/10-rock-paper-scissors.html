<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles/10-rock-paper-scissors.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>

    <!--This is a Rock Button-->
    <button class="move-btn" onclick="
    playGame('Rock');
    ">
    <img class="move-icon" src="images/rock-emoji.png">
    </button>

    <!--This is a Paper Button-->

    <button class="move-btn" onclick="
    playGame('Paper');
    ">
    <img class="move-icon" src="images/paper-emoji.png">
    </button>

    <!--This is a Scissors Button-->

    <button class="move-btn" onclick="
      playGame('Scissors');
    ">
    <img class="move-icon" src="images/scissors-emoji.png">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>


    <!--This is a reset score button-->

    <button class="reset-score-btn" 
    onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    updateScoreElement();
    localStorage.removeItem('score');
    ">Reset Score</button>

    <script src="scripts/10-rock-paper-scissors.js"></script>
  </body>
</html>
